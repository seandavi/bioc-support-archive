[project]
name = "bioc-support-archive"
version = "0.1.0"
description = "Static archive of support.bioconductor.org"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<1.5", "pagefind[bin]>=1.3"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
